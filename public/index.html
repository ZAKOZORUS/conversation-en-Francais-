<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Parle Francais" />
<title>Parle Francais - Conversation audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080d;
    --ink: #f5f5f8;
    --muted: rgba(245,245,248,0.68);
    --muted-soft: rgba(245,245,248,0.4);
    --glass: rgba(255,255,255,0.09);
    --glass-strong: rgba(255,255,255,0.16);
    --glass-border: rgba(255,255,255,0.2);
    --blue: #4f7bff;
    --red: #ff4d6d;
    --paper: rgba(248,247,252,0.97);
    --paper-text: #16151d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif;
  }
  body {
    background:
      linear-gradient(180deg, rgba(8,8,13,0.55) 0%, rgba(8,8,13,0.72) 45%, rgba(8,8,13,0.94) 100%),
      radial-gradient(560px 400px at 0% 0%, rgba(79,123,255,0.35), transparent 60%),
      radial-gradient(560px 400px at 100% 10%, rgba(255,77,109,0.3), transparent 60%),
      url('/images/bg-paris.jpg');
    background-repeat: no-repeat;
    background-size: cover, cover, cover, cover;
    background-position: center, center, center, center 35%;
    background-attachment: fixed;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  header {
    padding: max(22px, env(safe-area-inset-top)) 20px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  header .brand h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.5px;
    background: linear-gradient(100deg, #ffffff 20%, var(--blue) 55%, var(--red) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .sub {
    font-size: 11px;
    color: var(--muted-soft);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1.8px;
    font-weight: 600;
  }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
  }

  /* ---------- Menus deroulants personnalises ---------- */
  .dropdown { position: relative; flex-shrink: 0; }
  .dd-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 14px;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .dd-trigger:active { background: rgba(255,255,255,0.24); }
  .dd-chevron { flex-shrink: 0; opacity: 0.75; transition: transform 0.2s; }
  .dropdown.open .dd-chevron { transform: rotate(180deg); }
  .dd-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 190px;
    background: rgba(18,16,26,0.92);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    box-shadow: 0 20px 44px rgba(0,0,0,0.55);
    z-index: 40;
  }
  .dd-menu.align-left { right: auto; left: 0; }
  .dropdown.open .dd-menu { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .dd-item {
    background: transparent;
    border: none;
    color: var(--muted);
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: "Plus Jakarta Sans", sans-serif;
    cursor: pointer;
  }
  .dd-item:active { background: var(--glass-strong); }
  .dd-item.selected {
    color: white;
    background: linear-gradient(135deg, var(--blue), var(--red));
  }

  #voiceRow {
    padding: 0 20px 14px;
    align-items: center;
    gap: 8px;
  }
  #voiceRow label {
    font-size: 11px;
    color: var(--muted-soft);
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-weight: 700;
    white-space: nowrap;
  }
  #voiceDropdown { flex: 1; min-width: 0; }
  #testVoiceBtn {
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  #testVoiceBtn:active { background: var(--glass-strong); }

  #warning {
    display: none;
    background: rgba(255,77,109,0.18);
    border-top: 1px solid rgba(255,77,109,0.4);
    border-bottom: 1px solid rgba(255,77,109,0.4);
    color: #ffd0d8;
    font-size: 12.5px;
    line-height: 1.5;
    padding: 10px 20px;
    text-align: center;
  }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 10px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #transcript::-webkit-scrollbar { width: 5px; }
  #transcript::-webkit-scrollbar-thumb { background: var(--glass-strong); border-radius: 4px; }

  .bubble {
    max-width: 84%;
    padding: 13px 16px;
    border-radius: 20px;
    line-height: 1.5;
    font-size: 15px;
    font-weight: 500;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--blue), var(--red));
    color: white;
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 20px rgba(79,123,255,0.3);
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--paper);
    color: var(--paper-text);
    border-bottom-left-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .bubble.assistant.speaking {
    box-shadow: 0 0 0 2px var(--blue), 0 6px 20px rgba(79,123,255,0.35);
  }
  .bubble.interim {
    opacity: 0.5;
    font-style: italic;
  }

  #status {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-soft);
    min-height: 16px;
    padding: 0 16px 8px;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  footer {
    padding: 14px 20px max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .footerRow { display: flex; gap: 8px; width: 100%; justify-content: center; }
  .smallBtn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    color: var(--ink);
    padding: 7px 14px 7px 7px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s;
  }
  .smallBtn:active { background: rgba(255,255,255,0.26); }
  .icon-chip {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--blue), var(--red));
  }

  #micBtn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--blue), var(--red));
    color: white;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 8px rgba(79,123,255,0.12), 0 10px 30px rgba(79,123,255,0.45);
    cursor: pointer;
    transition: transform 0.15s;
  }
  #micBtn:active { transform: scale(0.94); }
  #micBtn.listening { animation: pulse 1.3s infinite; }
  #micBtn:disabled { opacity: 0.4; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,77,109,0.55); }
    70% { box-shadow: 0 0 0 22px rgba(255,77,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); }
  }

  #textFallback {
    display: none;
    width: 100%;
    gap: 8px;
  }
  #textFallback.active { display: flex; }
  #textInput {
    flex: 1;
    padding: 13px 16px;
    border-radius: 999px;
    color: var(--ink);
    font-size: 15px;
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  #textInput::placeholder { color: var(--muted-soft); }
  #textInput:focus { outline: none; border-color: var(--blue); }
  #sendBtn {
    background: linear-gradient(135deg, var(--blue), var(--red));
    color: white;
    border: none;
    border-radius: 999px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  #sendBtn:active { filter: brightness(1.1); }

  #photoCredit {
    position: fixed;
    bottom: 4px;
    right: 8px;
    font-size: 8.5px;
    color: rgba(245,245,248,0.35);
    pointer-events: none;
    z-index: 1;
  }
  #photoCredit a { color: inherit; pointer-events: auto; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Parle Francais</h1>
      <div class="sub">Conversation audio</div>
    </div>
    <div class="dropdown" id="levelDropdown">
      <button type="button" class="dd-trigger">
        <span class="dd-label">Intermediaire</span>
        <svg class="dd-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="dd-menu align-left"></div>
    </div>
    <select id="level" style="display:none">
      <option value="debutant">Debutant</option>
      <option value="intermediaire" selected>Intermediaire</option>
      <option value="avance">Avance</option>
    </select>
  </header>

  <div id="voiceRow" style="display:none;">
    <label>Voix</label>
    <div class="dropdown" id="voiceDropdown">
      <button type="button" class="dd-trigger" style="width:100%;">
        <span class="dd-label">...</span>
        <svg class="dd-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="dd-menu align-left"></div>
    </div>
    <select id="voiceSelect" style="display:none"></select>
    <button id="testVoiceBtn" class="glass">Tester</button>
  </div>

  <div id="warning"></div>

  <div id="transcript"></div>
  <div id="status"></div>

  <footer>
    <div class="footerRow">
      <button class="smallBtn" id="resetBtn"><span class="icon-chip">🔄</span>Recommencer</button>
      <button class="smallBtn" id="muteBtn"><span class="icon-chip" id="muteIcon">🔊</span><span id="muteLabel">Voix ON</span></button>
      <button class="smallBtn" id="keyboardBtn"><span class="icon-chip">⌨️</span>Clavier</button>
    </div>

    <button id="micBtn" title="Appuie pour parler">🎤</button>

    <div id="textFallback">
      <input type="text" id="textInput" class="glass" placeholder="Ecris ta phrase en francais..." />
      <button id="sendBtn">Envoyer</button>
    </div>
  </footer>

  <div id="photoCredit">Photo : Getfunky Paris / Wikimedia Commons (CC BY 2.0)</div>
</div>

<script>
const transcriptEl = document.getElementById('transcript');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('micBtn');
const levelSelect = document.getElementById('level');
const resetBtn = document.getElementById('resetBtn');
const muteBtn = document.getElementById('muteBtn');
const keyboardBtn = document.getElementById('keyboardBtn');
const textFallback = document.getElementById('textFallback');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const warningEl = document.getElementById('warning');

let messages = []; // {role: 'user'|'assistant', content: string}
let muted = false;
let busy = false;

// ---------- Menus deroulants personnalises (pilotent un <select> cache) ----------
function initDropdown(selectEl, wrapperId) {
  const wrapper = document.getElementById(wrapperId);
  const trigger = wrapper.querySelector('.dd-trigger');
  const label = wrapper.querySelector('.dd-label');
  const menu = wrapper.querySelector('.dd-menu');

  function close() { wrapper.classList.remove('open'); }
  function open() { wrapper.classList.add('open'); }

  function render() {
    menu.innerHTML = '';
    Array.from(selectEl.options).forEach((opt) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'dd-item' + (opt.value === selectEl.value ? ' selected' : '');
      item.textContent = opt.textContent;
      item.addEventListener('click', () => {
        selectEl.value = opt.value;
        selectEl.dispatchEvent(new Event('change'));
        close();
        render();
      });
      menu.appendChild(item);
    });
    const current = selectEl.options[selectEl.selectedIndex];
    label.textContent = current ? current.textContent : '';
  }

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    wrapper.classList.contains('open') ? close() : open();
  });
  document.addEventListener('click', close);

  render();
  return { render };
}

const levelDropdown = initDropdown(levelSelect, 'levelDropdown');

// ---------- Niveau (sauvegarde locale) ----------
levelSelect.value = localStorage.getItem('fc_level') || 'intermediaire';
levelDropdown.render();
levelSelect.addEventListener('change', () => {
  localStorage.setItem('fc_level', levelSelect.value);
});

// ---------- Affichage des bulles ----------
function addBubble(role, text, opts = {}) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role + (opts.interim ? ' interim' : '');
  div.textContent = text;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  return div;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function clearTranscript() {
  while (transcriptEl.firstChild) {
    transcriptEl.removeChild(transcriptEl.firstChild);
  }
}

// ---------- Appel au serveur (Claude) ----------
async function sendToClaude(userText) {
  messages.push({ role: 'user', content: userText });
  busy = true;
  micBtn.disabled = true;
  setStatus('Ca reflechit...');

  const thinkingBubble = addBubble('assistant', '...', {});

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages, level: levelSelect.value })
    });
    const data = await res.json();

    if (!res.ok) {
      thinkingBubble.textContent = "Erreur : " + (data.error || 'inconnue');
      thinkingBubble.style.color = '#fca5a5';
      setStatus('');
      busy = false;
      micBtn.disabled = false;
      return;
    }

    messages.push({ role: 'assistant', content: data.reply });
    thinkingBubble.textContent = data.reply;
    speak(data.reply, thinkingBubble);
  } catch (err) {
    thinkingBubble.textContent = 'Erreur reseau : impossible de contacter le serveur.';
    thinkingBubble.style.color = '#fca5a5';
    setStatus('');
    busy = false;
    micBtn.disabled = false;
  }
}

// ---------- Synthese vocale (TTS) : voix neurales generees par le serveur ----------
const voiceSelect = document.getElementById('voiceSelect');
const voiceRow = document.getElementById('voiceRow');
const testVoiceBtn = document.getElementById('testVoiceBtn');
const voiceDropdown = initDropdown(voiceSelect, 'voiceDropdown');
let selectedVoice = localStorage.getItem('fc_edgeVoice') || '';
let currentAudio = null;

function stopSpeaking() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

fetch('/api/voices')
  .then((r) => r.json())
  .then((data) => {
    const voices = data.voices || [];
    if (!voices.length) return;
    voiceSelect.innerHTML = '';
    voices.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.label;
      voiceSelect.appendChild(opt);
    });
    if (!voices.some((v) => v.id === selectedVoice)) selectedVoice = voices[0].id;
    voiceSelect.value = selectedVoice;
    voiceDropdown.render();
    voiceRow.style.display = 'flex';
  })
  .catch(() => { /* le selecteur restera cache, on utilisera le fallback navigateur */ });

voiceSelect.addEventListener('change', () => {
  selectedVoice = voiceSelect.value;
  localStorage.setItem('fc_edgeVoice', selectedVoice);
});

testVoiceBtn.addEventListener('click', () => {
  speak("Bonjour, voici un exemple de ma voix pour pratiquer le francais.", null);
});

// Repli local si le serveur/voix en ligne est injoignable (ex: pas d'internet)
function speakWithBrowserFallback(text, bubbleEl) {
  if (!('speechSynthesis' in window)) {
    setStatus('Appuie sur le micro pour repondre');
    return;
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  const voices = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.startsWith('fr'));
  if (voices.length) utter.voice = voices[0];
  if (bubbleEl) bubbleEl.classList.add('speaking');
  setStatus('Ca parle... (voix de secours hors-ligne)');
  utter.onend = utter.onerror = () => {
    if (bubbleEl) bubbleEl.classList.remove('speaking');
    setStatus('Appuie sur le micro pour repondre');
  };
  speechSynthesis.speak(utter);
}

async function speak(text, bubbleEl) {
  busy = false;
  micBtn.disabled = false;
  if (muted) {
    setStatus('Appuie sur le micro pour repondre');
    return;
  }

  stopSpeaking();
  if (bubbleEl) bubbleEl.classList.add('speaking');
  setStatus('Generation de la voix...');

  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, voice: selectedVoice })
    });
    if (!res.ok) throw new Error('tts failed');

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;

    setStatus('Ca parle...');
    audio.onended = audio.onerror = () => {
      URL.revokeObjectURL(url);
      if (currentAudio === audio) currentAudio = null;
      if (bubbleEl) bubbleEl.classList.remove('speaking');
      setStatus('Appuie sur le micro pour repondre');
    };
    await audio.play();
  } catch (err) {
    speakWithBrowserFallback(text, bubbleEl);
  }
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteIcon').textContent = muted ? '🔇' : '🔊';
  document.getElementById('muteLabel').textContent = muted ? 'Voix OFF' : 'Voix ON';
  if (muted) stopSpeaking();
});

// ---------- Reconnaissance vocale (STT) ----------
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let interimBubble = null;

if (SpeechRecognitionCtor) {
  recognition = new SpeechRecognitionCtor();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    setStatus('Je t\'ecoute...');
    interimBubble = addBubble('user', '...', { interim: true });
  };

  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interimText += t;
    }
    if (interimBubble) {
      interimBubble.textContent = finalText || interimText || '...';
    }
    if (finalText.trim()) {
      if (interimBubble) {
        interimBubble.textContent = finalText.trim();
        interimBubble.classList.remove('interim');
        interimBubble = null;
      }
      sendToClaude(finalText.trim());
    }
  };

  recognition.onerror = (event) => {
    listening = false;
    micBtn.classList.remove('listening');
    if (interimBubble) {
      interimBubble.remove();
      interimBubble = null;
    }
    if (event.error === 'no-speech') {
      setStatus('Je n\'ai rien entendu, reessaie.');
    } else if (event.error === 'not-allowed' || event.error === 'permission-denied') {
      setStatus('Acces au micro refuse. Autorise le micro dans ton navigateur.');
    } else {
      setStatus('Erreur micro : ' + event.error);
    }
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    if (interimBubble && !interimBubble.textContent.trim()) {
      interimBubble.remove();
    }
    interimBubble = null;
  };

  micBtn.addEventListener('click', () => {
    if (busy) return;
    if (listening) {
      recognition.stop();
      return;
    }
    stopSpeaking();
    try {
      recognition.start();
    } catch (e) { /* deja demarre */ }
  });
} else {
  // Pas de reconnaissance vocale disponible (ex: Safari iOS) -> mode clavier force
  micBtn.style.display = 'none';
  textFallback.classList.add('active');
  warningEl.style.display = 'block';
  warningEl.textContent = "Ton navigateur ne supporte pas la reconnaissance vocale (frequent sur Safari iOS). Utilise le clavier ci-dessous, ou essaie avec Chrome sur Android.";
}

// ---------- Mode clavier (fallback) ----------
keyboardBtn.addEventListener('click', () => {
  textFallback.classList.toggle('active');
});

function sendTextInput() {
  const val = textInput.value.trim();
  if (!val || busy) return;
  addBubble('user', val);
  textInput.value = '';
  sendToClaude(val);
}
sendBtn.addEventListener('click', sendTextInput);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendTextInput();
});

// ---------- Reinitialiser la conversation ----------
resetBtn.addEventListener('click', () => {
  if (busy) return;
  stopSpeaking();
  messages = [];
  clearTranscript();
  startConversation();
});

// ---------- Demarrage ----------
function startConversation() {
  const greeting = "Salut ! Je suis ravi de pratiquer le francais avec toi aujourd'hui. Comment tu t'appelles, et de quoi as-tu envie de parler ?";
  messages.push({ role: 'assistant', content: greeting });
  const bubble = addBubble('assistant', greeting);
  speak(greeting, bubble);
}

startConversation();
</script>
</body>
</html>
